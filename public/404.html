<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Screna AI</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: hsl(220, 20%, 98%);
      color: hsl(222, 22%, 15%);
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card { max-width: 520px; text-align: center; }
    .logo { height: 32px; width: auto; margin-bottom: 28px; }
    .code { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: hsl(221, 91%, 60%); margin: 0 0 12px; }
    h1 { font-size: 32px; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 12px; }
    p { font-size: 16px; line-height: 1.6; color: hsl(222, 12%, 45%); margin: 0 0 28px; }
    .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    a.btn {
      display: inline-flex; align-items: center; height: 42px; padding: 0 20px;
      border-radius: 999px; font-size: 14px; font-weight: 500; text-decoration: none;
      background: hsl(221, 91%, 60%); color: #fff;
    }
    a.btn:hover { background: hsl(221, 91%, 55%); }
    a.btn.secondary { background: #fff; color: hsl(222, 22%, 15%); border: 1px solid hsl(220, 16%, 88%); }
    a.btn.secondary:hover { background: hsl(220, 20%, 96%); }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="/logo.png" alt="Screna AI" />
    <p class="code">404</p>
    <h1>We couldn&rsquo;t find that page</h1>
    <p>
      The page you&rsquo;re looking for doesn&rsquo;t exist, or it may have been moved.
      Try one of the links below.
    </p>
    <div class="links">
      <a class="btn" href="/">Go to homepage</a>
      <a class="btn secondary" href="/blog">Read the blog</a>
      <a class="btn secondary" href="/help">Help center</a>
    </div>
  </main>
</body>
</html>
